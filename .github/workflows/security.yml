# Free stand-ins for GitHub's paid code and secret scanning on private repos:
# npm audit for known-vulnerable dependencies, gitleaks for committed secrets.
# The weekly run catches advisories published after the last merge.
name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Blocking gate covers what ships. The full audit also lists dev tooling; it is
      # informational because eslint-config-next 16.x pulls braces 3.0.3 (GHSA-vfj7-8cjw-p6xm),
      # which has no patched 3.x release yet. Make it blocking again once that clears.
      - run: npm audit --omit=dev --audit-level=high
      - name: Full audit including dev tooling (informational)
        run: npm audit --audit-level=high
        continue-on-error: true
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C "$RUNNER_TEMP" gitleaks
      - name: Scan history
        run: $RUNNER_TEMP/gitleaks git --redact --no-banner .
