<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16121f" />
    <title>ByteRush — Offline</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #16121f;
        color: #f3f0f8;
        text-align: center;
      }
      .card {
        max-width: 20rem;
      }
      .bolt {
        font-size: 3rem;
        line-height: 1;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: #a89bb8;
        font-size: 0.95rem;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        margin-top: 1.25rem;
        color: #c084fc;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bolt" aria-hidden="true">⚡</div>
      <h1>You're offline</h1>
      <p>ByteRush needs a connection to load new lessons. Your last visit may still open from cache.</p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
